[package]
name = "nano-banana-cli"
version = "0.1.0"
edition = "2024"
description = "CLI for Google Gemini text generation and Google/OpenAI image generation"
license = "MIT"

[dependencies]
base64 = "0.22"
clap = { version = "4", features = ["derive", "env"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
ureq = { version = "3", features = ["json"] }
